<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The inner room</title>
    <style>
      body { font-family: Georgia, "Times New Roman", serif; max-width: 34rem; margin: 0 auto; padding: 3rem 1rem; line-height: 1.5; background: #2f3a1b; color: #e6efd4; }
      a { color: #dec970; }
    </style>
  </head>
  <body>
    <h1>The inner room</h1>
    <p>This whole page was sealed. Its public address serves only a door, and these words existed nowhere on the host until the phrase opened them.</p>
    <p id="ran"></p>
    <p id="remembered"></p>
    <web-threshold sealed="/s/site.json" remember="session" hidden></web-threshold>
    <script>document.getElementById("ran").textContent = "Its own script ran after opening.";</script>
    <script type="module">
      import "/web-threshold-sealed.js";
      // The element is already upgraded by now, so this attaches after any replay.
      document.querySelector("web-threshold").addEventListener("tier-unlocked", ({ detail }) => {
        if (detail.tier === "fox") document.getElementById("remembered").textContent = "The fox's door is open here too.";
      });
    </script>
    <p><a href="/">Back to the threshold</a></p>
  </body>
</html>
