<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Threshold — phone bench</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 34rem; margin: 0 auto; padding: 2rem 1rem; line-height: 1.5; background: #fff; color: #222; }
      button { font: inherit; padding: 0.6em 1.2em; }
      #result { font-size: 1.5rem; }
    </style>
  </head>
  <body>
    <h1>Phone bench</h1>
    <p>Times one 600,000-iteration key derivation plus 64 slot trials, the cost of one attempt. It needs HTTPS or localhost. Under 1 second is the target.</p>
    <button id="go">Run 5 times</button>
    <p id="result" role="status"></p>
    <p id="ua"></p>
    <script type="module">
      const result = document.getElementById("result");
      document.getElementById("ua").textContent = navigator.userAgent;

      async function attempt() {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const material = await crypto.subtle.importKey("raw", new TextEncoder().encode("a wrong phrase"), "PBKDF2", false, ["deriveBits"]);
        const started = performance.now();
        const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt, iterations: 600000 }, material, 256);
        const key = await crypto.subtle.importKey("raw", bits, "AES-GCM", false, ["decrypt"]);
        for (let i = 0; i < 64; i++) {
          const iv = crypto.getRandomValues(new Uint8Array(12));
          const ct = crypto.getRandomValues(new Uint8Array(528));
          await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct).catch(() => {});
        }
        return performance.now() - started;
      }

      document.getElementById("go").addEventListener("click", async () => {
        if (!crypto.subtle) {
          result.textContent = "No crypto.subtle: this page needs HTTPS or localhost.";
          return;
        }
        result.textContent = "Running…";
        const times = [];
        for (let i = 0; i < 5; i++) times.push(await attempt());
        times.sort((a, b) => a - b);
        result.textContent = `Median ${Math.round(times[2])} ms · slowest ${Math.round(times[4])} ms`;
      });
    </script>
  </body>
</html>
